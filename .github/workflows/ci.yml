# The finished CI pipeline this tutorial builds up to.
# NOTE: while working through the steps, you WRITE this yourself piece by piece
# (Steps 2 -> 7). This file is the final reference for what it should look like.

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: run all the tests on every push/PR to main
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test

  # Stage 2: build the runnable jar, but only if tests passed
  build-jar:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*-jar-with-dependencies.jar

  # Stage 3: build a Docker image, only if the jar built
  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t calculator-app .
